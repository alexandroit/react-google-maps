name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [22.22.3, 24.15.0]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            docs-src/react-17/package-lock.json
            docs-src/react-18/package-lock.json
            docs-src/react-19/package-lock.json
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Validate compatibility fixture catalog
        if: matrix.node == '22.22.3'
        run: npm run test:fixtures
      - run: npm run typecheck --if-present
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=low
      - name: Build and audit supported React documentation
        if: matrix.node == '22.22.3'
        run: |
          npm ci --prefix docs-src/react-17
          npm run build:docs:react-17
          npm audit --prefix docs-src/react-17 --audit-level=low
          npm ci --prefix docs-src/react-18
          npm run build:docs:react-18
          npm audit --prefix docs-src/react-18 --audit-level=low
          npm ci --prefix docs-src/react-19
          npm run build:docs:react-19
          npm audit --prefix docs-src/react-19 --audit-level=low
      - name: Build release artifact
        if: matrix.node == '22.22.3'
        run: |
          mkdir release
          npm pack --ignore-scripts --pack-destination release
          (cd release && sha512sum *.tgz > SHA512SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: matrix.node == '22.22.3'
        with:
          name: ${{ github.event.repository.name }}-release
          path: release/
          if-no-files-found: error
          retention-days: 30
